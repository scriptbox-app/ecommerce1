# =============================================================================
# aaPanel / BT Panel — FULL FIX for Laravel routes (404 on /admin, /products, etc.)
# =============================================================================
#
# PROBLEM: Only homepage (/) works. All other pages show nginx 404.
# CAUSE:   nginx is not sending requests to index.php (it ignores .htaccess).
#
# =============================================================================
# OPTION A — RECOMMENDED: Change document root to public/  (easiest)
# =============================================================================
#
# aaPanel → Website → ecommerce1.scriptbox.app → Site Directory
#   Change from: /www/wwwroot/ecommerce1.scriptbox.app
#   Change to:   /www/wwwroot/ecommerce1.scriptbox.app/public
#
# Then set Pseudo-static to "laravel" or paste this in rewrite config:
#
#   location / {
#       try_files $uri $uri/ /index.php?$query_string;
#   }
#
# Remove from .env (no longer needed):
#   ASSET_URL=...
#   STORAGE_URL=...
#
# Run: php artisan config:clear
#
# =============================================================================
# OPTION B — Keep document root at project root
# =============================================================================
#
# aaPanel → Website → ecommerce1.scriptbox.app → Config → Nginx config
#
# Find the existing "location /" block and REPLACE it with the rules below.
# Also find "location ~ .*\.php" or "enable-php" include — keep that as-is.
#
# Paste INSIDE server { } block (adjust site path if different):

# --- START: paste below ---

location ^~ /storage/ {
    alias /www/wwwroot/ecommerce1.scriptbox.app/public/storage/;
    expires 30d;
    access_log off;
}

location ^~ /public/ {
    try_files $uri $uri/ =404;
    expires 30d;
    access_log off;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# --- END: paste above ---

# Keep .env on server:
#   ASSET_URL=https://ecommerce1.scriptbox.app/public
#   STORAGE_URL=https://ecommerce1.scriptbox.app/public/storage
#
# After saving nginx config, reload nginx and test:
#   https://ecommerce1.scriptbox.app/admin
#   https://ecommerce1.scriptbox.app/ajax/featured-product-categories
#
# =============================================================================
# OPTION C — Pseudo-static only (aaPanel → Website → Rewrite)
# =============================================================================
#
# If you cannot edit full nginx config, paste this in "Rewrite" / "Pseudo-static":
#
# location / {
#     try_files $uri $uri/ /index.php?$query_string;
# }
#
# location ^~ /storage/ {
#     alias /www/wwwroot/ecommerce1.scriptbox.app/public/storage/;
# }

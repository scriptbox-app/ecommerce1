# Paste into aaPanel / BT Panel → Website → ecommerce1.scriptbox.app
# → Config Files → Nginx config (inside the server { } block, before closing brace)
#
# Document root: /www/wwwroot/ecommerce1.scriptbox.app  (project root, NOT public/)

# Serve uploaded media (images, fonts, etc.)
location ^~ /storage/ {
    alias /www/wwwroot/ecommerce1.scriptbox.app/public/storage/;
    expires 30d;
    access_log off;
}

# Serve published CMS assets (themes, vendor, etc.)
location ^~ /public/ {
    try_files $uri $uri/ =404;
    expires 30d;
    access_log off;
}

# Route all Laravel URLs (ajax, admin, products, etc.) to index.php
location / {
    try_files $uri $uri/ /index.php?$query_string;
}
